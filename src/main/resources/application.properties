ai.api-url=${AI_API_URL:https://api.x.ai/v1/chat/completions}
ai.api-key=${AI_API_KEY:${XAI_API_KEY:${OPENROUTER_API_KEY:}}}
ai.model=${AI_MODEL:grok-4-fast-non-reasoning}

spring.application.name=HackathonBank
spring.config.import=optional:file:.env.local[.properties]

server.port=8080

spring.datasource.url=jdbc:h2:mem:hackathonbank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.ai.model.chat=openai
spring.ai.openai.base-url=${AI_BASE_URL:https://api.x.ai}
spring.ai.openai.api-key=${ai.api-key}
spring.ai.openai.chat.options.model=${ai.model}
spring.ai.openai.chat.options.temperature=0.15
spring.ai.openai.chat.options.http-headers.HTTP-Referer=${AI_HTTP_REFERER:${OPENROUTER_REFERER:http://localhost:8080}}
spring.ai.openai.chat.options.http-headers.X-Title=${AI_APP_TITLE:HackathonBank}

app.ai.enabled=${APP_AI_ENABLED:true}
app.ai.primary-model=${ai.model}
app.ai.fallback-models[0]=openai/gpt-4.1-mini
app.ai.fallback-models[1]=openrouter/auto
app.ai.temperature=0.15
app.ai.request-timeout-seconds=${APP_AI_REQUEST_TIMEOUT_SECONDS:40}

app.cors.allowed-origins[0]=http://localhost:3000
app.cors.allowed-origins[1]=http://localhost:8080
app.cors.allowed-origins[2]=http://127.0.0.1:3000
app.cors.allowed-origins[3]=http://127.0.0.1:8080
app.cors.allowed-origins[4]=http://10.0.2.2:8080

# Security (permits all for demo; restrict in production)
app.security.permit-all=true
