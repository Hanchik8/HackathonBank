ai.api-url=${AI_API_URL:https://openrouter.ai/api/v1/chat/completions}
ai.api-key=${OPENROUTER_API_KEY:demo-key}
ai.model=${AI_MODEL:google/gemini-2.0-flash-001}

spring.application.name=HackathonBank
spring.config.import=optional:file:.env.local[.properties]

server.port=8080

spring.datasource.url=jdbc:h2:mem:hackathonbank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.ai.model.chat=openai
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.api-key=${ai.api-key}
spring.ai.openai.chat.options.model=${ai.model}
spring.ai.openai.chat.options.temperature=0.15
spring.ai.openai.chat.options.http-headers.HTTP-Referer=${OPENROUTER_REFERER:http://localhost:8080}
spring.ai.openai.chat.options.http-headers.X-Title=HackathonBank

app.ai.enabled=${APP_AI_ENABLED:true}
app.ai.primary-model=${ai.model}
app.ai.fallback-models[0]=openai/gpt-4.1-mini
app.ai.fallback-models[1]=openrouter/auto
app.ai.temperature=0.15
app.ai.request-timeout-seconds=${APP_AI_REQUEST_TIMEOUT_SECONDS:8}

app.cors.allowed-origins[0]=http://localhost:3000
app.cors.allowed-origins[1]=http://localhost:8080
app.cors.allowed-origins[2]=http://127.0.0.1:3000
app.cors.allowed-origins[3]=http://127.0.0.1:8080
app.cors.allowed-origins[4]=http://10.0.2.2:8080
